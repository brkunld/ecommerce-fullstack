version: '3.8'

services:
  # 🐘 1. PostgreSQL Veritabanı Servisi
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  # ⚙️ 2. Backend Express API Servisi
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecommerce-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      # Docker içinden postgres servisine bağlanıyoruz:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/ecommerce_db?schema=public"
      JWT_SECRET: "super-secret-jwt-key-burak-ecommerce-2026"
      JWT_EXPIRES_IN: "7d"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  # 💻 3. Frontend React Vite Servisi
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:5000/api"
    depends_on:
      - backend
    networks:
      - ecommerce-network

# 💾 Kalıcı Veri Hacmi (Container kapansa bile veritabanı silinmez)
volumes:
  postgres_data:

# 🌐 Servislerin birbiriyle konuşmasını sağlayan Docker Ağı
networks:
  ecommerce-network:
    driver: bridge
